<!DOCTYPE html>
<html>
    <head>
        <title>Test</title>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <section>
            <h2>Create new post</h2>
                <textarea id="post-content"></textarea>
                <div></div>
                <button id="post-button">Post</button>
        </section>

        <div class="waterfall">
            {{ range . }}
                <article class="post-container">
                    <p>{{ .Content }}</p>
                    <small>Created at {{ .CreatedAt }}</small>
                    <button class="post-delete-button" data-id="{{ .Id }}">Delete</button>
                </article>
            {{ end }}            
        </div>
    </body>

    <script>
        const button = document.getElementById("post-button")
        button.addEventListener("click", async () => {
            const contentField = document.getElementById("post-content")
            const res = await fetch("http://localhost:8080/api/posts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: contentField.value })
            })

            if (res.status === 201) {
                contentField.value = ""
                window.location.reload()
            }
        })


        const deleteButtons = document.querySelectorAll(".post-delete-button")
        deleteButtons.forEach((delBtn) => {
            delBtn.addEventListener("click", async () => {
                const id = delBtn.dataset.id
                console.log(id)
                const res = await fetch(`http://localhost:8080/api/posts/${id}`, {
                    method: "DELETE"
                }) 
                if (res.ok) {
                    window.location.reload()
                }
            })
        })
    </script>
</html>
